<style>
  /* Layout: cabecera fija con pestañas de estancias que se desplazan; debajo, secciones tipo lista de la compra con precio por producto */
  :root{
    --bg:#F8F5F2;
    --surface:#FFFFFF;
    --surface-soft:#F1ECE8;
    --ink:#2A2226;
    --ink-soft:#75686E;
    --ink-faint:#B2A6AB;
    --border:#E6DDD9;
    --accent:#7A3E5A;
    --accent-ink:#FFFFFF;
    --ok:#3F7D57;
    --danger:#B0483F;
    --shadow:0 1px 2px rgba(42,34,38,.06),0 4px 14px rgba(42,34,38,.05);
    --font-display:"Fraunces",Georgia,serif;
    --font-body:"Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1A1618;--surface:#241F22;--surface-soft:#2D272A;--ink:#F1E9EC;--ink-soft:#B6A9AE;--ink-faint:#6E6267;
      --border:#3B3337;--accent:#D394B2;--accent-ink:#2A1420;--ok:#7CC496;--danger:#E58A80;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1A1618;--surface:#241F22;--surface-soft:#2D272A;--ink:#F1E9EC;--ink-soft:#B6A9AE;--ink-faint:#6E6267;
    --border:#3B3337;--accent:#D394B2;--accent-ink:#2A1420;--ok:#7CC496;--danger:#E58A80;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);color-scheme:dark;
  }
  *{box-sizing:border-box;}
  body{background:var(--bg);color:var(--ink);font-family:var(--font-body);padding-inline:16px;padding-block:0 40px;}
  h1,h2,h3{font-family:var(--font-display);}
  .wrap{max-width:640px;margin:0 auto;}

  /* tono de color por estancia */
  .tinted{--c:var(--cl,var(--accent));}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tinted{--c:var(--cd,var(--cl,var(--accent)));}}
  :root[data-theme="dark"] .tinted{--c:var(--cd,var(--cl,var(--accent)));}

  header.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:16px 10px;z-index:5;}
  header.top h1{font-size:1.75rem;font-weight:600;margin:0 0 10px;letter-spacing:-.01em;text-wrap:balance;}
  nav.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;margin-inline:-16px;padding-inline:16px;}
  nav.tabs button{flex-shrink:0;border:1px solid var(--border);background:var(--surface);color:var(--ink-soft);font:500 .85rem var(--font-body);padding:7px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;}
  nav.tabs button.on{background:var(--c);border-color:var(--c);color:var(--accent-ink);}
  nav.tabs .sep{width:1px;background:var(--border);flex-shrink:0;margin-inline:2px;}

  .page-head{margin:8px 0 14px;}
  .page-head h2{font-size:1.45rem;margin:0 0 4px;color:var(--c);text-wrap:balance;}
  .page-head .sub{color:var(--ink-soft);font-size:.9rem;margin:0 0 10px;}
  .money-line{font-variant-numeric:tabular-nums;font-size:.92rem;color:var(--ink-soft);margin:0 0 10px;}
  .money-line strong{color:var(--ink);}
  .bar{height:7px;border-radius:99px;background:var(--surface-soft);overflow:hidden;border:1px solid var(--border);}
  .bar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:99px;}

  button.pill{display:inline-flex;align-items:center;gap:7px;font:inherit;font-size:.84rem;color:var(--ink-soft);background:var(--surface-soft);border:1px solid var(--border);padding:7px 14px;border-radius:999px;cursor:pointer;font-variant-numeric:tabular-nums;}
  button.pill strong{color:var(--c);}
  button.pill.active{background:var(--c);border-color:var(--c);color:var(--accent-ink);}
  button.pill.active strong{color:var(--accent-ink);}
  .tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}

  main{display:flex;flex-direction:column;gap:16px;}
  section.group{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--c);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;}
  .g-head{display:flex;align-items:center;gap:8px;padding:11px 10px 4px 16px;}
  .g-head h3{font-size:1.05rem;font-weight:600;margin:0;color:var(--c);flex:1;min-width:0;}
  .g-sum{font-size:.78rem;color:var(--ink-faint);font-variant-numeric:tabular-nums;white-space:nowrap;}
  button.icon{border:none;background:transparent;color:var(--ink-faint);font-size:1.05rem;line-height:1;padding:5px 7px;border-radius:7px;cursor:pointer;flex-shrink:0;}
  button.icon:hover{background:var(--surface-soft);color:var(--ink);}
  button.icon.del:hover{color:var(--danger);}

  ul.items{list-style:none;margin:0;padding:0 6px 4px;}
  ul.items:empty::after{content:"Sin elementos todavía";display:block;color:var(--ink-faint);font-size:.88rem;padding:8px 10px 12px;font-style:italic;}
  li.item{display:flex;align-items:center;gap:2px;padding:2px 2px;border-radius:8px;}
  li.item:hover{background:var(--surface-soft);}
  li.item.dragging{background:var(--surface-soft);box-shadow:0 6px 16px rgba(0,0,0,.18);}
  li.item.done{background:color-mix(in srgb,var(--c) 11%,transparent);}
  li.item.done .t{color:var(--ink-soft);text-decoration:line-through;text-decoration-color:var(--ink-faint);}
  .chk{display:grid;place-items:center;padding:6px;cursor:pointer;}
  input[type="checkbox"]{appearance:none;width:20px;height:20px;min-width:20px;border-radius:6px;border:1.6px solid var(--border);background:var(--surface);display:grid;place-content:center;cursor:pointer;margin:0;}
  input[type="checkbox"]::after{content:"";width:10px;height:10px;clip-path:polygon(14% 44%,0 65%,50% 100%,100% 16%,80% 0%,43% 62%);background:var(--accent-ink);transform:scale(0);transition:transform .12s;}
  input[type="checkbox"]:checked{background:var(--c);border-color:var(--c);}
  input[type="checkbox"]:checked::after{transform:scale(1);}
  button.txt{flex:1;min-width:0;text-align:left;background:none;border:none;font:inherit;color:var(--ink);padding:6px 4px;cursor:pointer;display:flex;align-items:baseline;gap:8px;}
  .t{font-size:.96rem;line-height:1.25;overflow-wrap:anywhere;flex:1;min-width:0;}
  .q{font-size:.78rem;color:var(--ink-soft);white-space:nowrap;}
  .p{font-size:.88rem;font-variant-numeric:tabular-nums;color:var(--ink-soft);white-space:nowrap;}
  .p.zero{color:var(--ink-faint);}
  button.drag{border:none;background:transparent;color:var(--ink-faint);width:26px;height:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;border-radius:7px;cursor:grab;touch-action:none;flex-shrink:0;}
  button.drag span{width:14px;height:2px;border-radius:1px;background:currentColor;}

  form.add{display:flex;gap:6px;padding:8px 12px 12px 16px;border-top:1px solid var(--border);margin-top:2px;}
  form.add input{min-width:0;background:var(--surface-soft);border:1px solid var(--border);border-radius:9px;padding:9px 10px;font:inherit;font-size:.9rem;color:var(--ink);}
  form.add input.name{flex:1;}
  form.add input.price{width:78px;text-align:right;}
  form.add button{border:none;background:var(--c);color:var(--accent-ink);width:38px;border-radius:9px;font-size:1.15rem;cursor:pointer;flex-shrink:0;}
  input::placeholder{color:var(--ink-faint);}

  form.newgroup{display:flex;gap:8px;}
  form.newgroup input{flex:1;min-width:0;background:var(--surface);border:1px dashed var(--border);border-radius:12px;padding:11px 14px;font:inherit;font-size:.9rem;color:var(--ink);}
  form.newgroup button,.btn{border:1px solid var(--border);background:var(--surface);color:var(--ink-soft);padding:9px 15px;border-radius:12px;font:inherit;font-size:.86rem;cursor:pointer;white-space:nowrap;}
  form.newgroup button:hover,.btn:hover{border-color:var(--c,var(--accent));color:var(--c,var(--accent));}
  .btn.primary{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:var(--accent-ink);}
  .btn.primary:hover{color:var(--accent-ink);filter:brightness(1.06);}
  .btn.danger{color:var(--danger);}
  .btn.danger.armed{background:var(--danger);border-color:var(--danger);color:var(--surface);}

  p.empty{color:var(--ink-soft);font-size:.92rem;background:var(--surface);border:1px dashed var(--border);border-radius:14px;padding:18px;text-align:center;margin:0;}

  /* resumen */
  .kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:6px;}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 12px;}
  .kpi .l{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);}
  .kpi .v{font-family:var(--font-display);font-size:1.15rem;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px;overflow-wrap:anywhere;}
  .kpi.spent .v{color:var(--accent);}
  .table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow-x:auto;box-shadow:var(--shadow);}
  table{width:100%;border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums;}
  th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap;}
  th:first-child,td:first-child{text-align:left;white-space:normal;}
  th{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);font-weight:600;}
  tr:last-child td{border-bottom:none;}
  tfoot td{font-weight:600;border-top:2px solid var(--border);}
  td .room{display:flex;align-items:center;gap:8px;color:var(--ink);background:none;border:none;font:inherit;padding:0;cursor:pointer;text-align:left;}
  td .dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex-shrink:0;}
  td .mini{height:4px;margin-top:5px;}
  h3.block{font-size:1.05rem;margin:14px 0 8px;}
  .rooms-admin{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:6px 8px;}
  .rooms-admin .row{display:flex;align-items:center;gap:6px;padding:5px 4px;border-bottom:1px solid var(--border);}
  .rooms-admin .row:last-of-type{border-bottom:none;}
  .rooms-admin .row .name{flex:1;min-width:0;display:flex;align-items:center;gap:8px;}
  .rooms-admin form{display:flex;gap:8px;padding:8px 4px 4px;}
  .rooms-admin form input{flex:1;min-width:0;background:var(--surface-soft);border:1px solid var(--border);border-radius:9px;padding:9px 10px;font:inherit;font-size:.9rem;color:var(--ink);}

  section.backup{margin-top:22px;padding:14px 16px 16px;background:var(--surface);border:1px solid var(--border);border-radius:14px;}
  section.backup h3{font-size:.98rem;margin:0 0 4px;}
  section.backup p{font-size:.82rem;color:var(--ink-soft);margin:0 0 10px;}
  .row-btns{display:flex;gap:8px;flex-wrap:wrap;}

  /* hoja de edición */
  .sheet-bg{position:fixed;inset:0;background:rgba(20,14,17,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center;}
  .sheet{background:var(--bg);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.25);max-height:90vh;overflow-y:auto;}
  @media (min-width:560px){.sheet-bg{align-items:center;}.sheet{border-radius:18px;}}
  .sheet h3{margin:0 0 12px;font-size:1.15rem;}
  .field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;}
  .field label{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);}
  .field input,.field select{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font:inherit;font-size:.95rem;color:var(--ink);width:100%;}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .sheet .row-btns{margin-top:6px;justify-content:space-between;}
  .sheet .row-btns div{display:flex;gap:8px;}
  .toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.86rem;z-index:30;}

  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  @media (max-width:420px){header.top h1{font-size:1.5rem;}table{font-size:.8rem;}th,td{padding:8px 6px;}th{font-size:.64rem;letter-spacing:.02em;}.kpi .v{font-size:1rem;}form.add input.price{width:66px;}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>

/* ---------- utilidades ---------- */
function eur(v){
  v = Math.round((v||0)*100)/100;
  var neg = v < 0; v = Math.abs(v);
  var ent = Math.floor(v), dec = Math.round((v-ent)*100);
  var s = String(ent).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  if(dec) s += "," + (dec<10?"0":"") + dec;
  return (neg?"-":"") + s + " €";
}
function parsePrice(s){ s = String(s||"").replace(/[€\s]/g,"").replace(/\.(?=\d{3}(\D|$))/g,"").replace(",","."); var v = parseFloat(s); return isFinite(v) && v >= 0 ? v : 0; }
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];}); }
function findRoom(id){ return state.rooms.find(function(r){ return r.id === id; }); }
function findGroup(room,id){ return room.groups.find(function(g){ return g.id === id; }); }
function tint(color){ var p = PALETTE[color % PALETTE.length]; return "--cl:"+p.l+";--cd:"+p.d; }
function itemTotal(it){ return (it.price||0) * (it.qty||1); }
function roomTotals(r){
  var t = {budget:0, spent:0, items:0, bought:0};
  r.groups.forEach(function(g){ g.items.forEach(function(it){ var v = itemTotal(it); t.budget += v; t.items++; if(it.bought){ t.spent += v; t.bought++; } }); });
  return t;
}
function groupTotals(g){ var t={budget:0,spent:0,bought:0}; g.items.forEach(function(it){ var v=itemTotal(it); t.budget+=v; if(it.bought){t.spent+=v;t.bought++;} }); return t; }

/* ---------- guardar ---------- */
function save(){

}
function schedulePublish(){

    '<main>'+groups+'</main>'+

function bindRoom(r){
  var v = document.getElementById("view");

  pt.addEventListener("click", function(){ ui.onlyPending = !ui.onlyPending; render(); });

    li.querySelector("input[type=checkbox]").addEventListener("change", function(e){ it.bought = e.target.checked; save(); render(); });

    e.preventDefault(); var name = document.getElementById("newGroupName").value.trim(); if(!name) return;

  });
}

/* ---------- arrastrar ---------- */
function startDrag(e, li, list, selector){
  e.preventDefault();
  dragState = {list:list, id:li.dataset.id, selector:selector, moved:false};
  li.classList.add("dragging");
  document.addEventListener("pointermove", onDragMove);
  document.addEventListener("pointerup", onDragEnd);
  document.addEventListener("pointercancel", onDragEnd);
}
function onDragMove(e){
  if(!dragState) return;
  var el = document.elementFromPoint(e.clientX, e.clientY);
  var over = el && el.closest ? el.closest(dragState.selector) : null;
  if(!over || over.dataset.id === dragState.id) return;
  var L = dragState.list;
  var from = L.findIndex(function(x){ return x.id === dragState.id; });
  var to = L.findIndex(function(x){ return x.id === over.dataset.id; });
  if(from < 0 || to < 0) return;
  L.splice(to, 0, L.splice(from,1)[0]);
  dragState.moved = true;
  render();
  var nl = document.querySelector(dragState.selector+'[data-id="'+dragState.id+'"]');
  if(nl) nl.classList.add("dragging");
}
function onDragEnd(){
  document.removeEventListener("pointermove", onDragMove);
  document.removeEventListener("pointerup", onDragEnd);
  document.removeEventListener("pointercancel", onDragEnd);
  if(!dragState) return;
  var nl = document.querySelector(dragState.selector+'[data-id="'+dragState.id+'"]');
  if(nl) nl.classList.remove("dragging");
  if(dragState.moved) save();
  dragState = null;
}

function armDelete(btn, onConfirm){

  document.getElementById("pendToggle").addEventListener("click", function(){ ui.onlyPending = !ui.onlyPending; render(); });
  v.querySelectorAll("li.item").forEach(function(li){
    var list = state.tasks[li.dataset.l]; var t = list.find(function(x){ return x.id === li.dataset.id; });
    li.querySelector("input[type=checkbox]").addEventListener("change", function(e){ t.done = e.target.checked; save(); render(); });
    li.querySelector("[data-edit]").addEventListener("click", function(){ openTaskSheet(li.dataset.l, t); });
    var del = li.querySelector("button.del");
    if(del) del.addEventListener("click", function(){ var i = list.indexOf(t); list.splice(i,1); save(); render(); undoToast("Tarea eliminada", function(){ list.splice(i,0,t); save(); render(); }); });
    var h = li.querySelector("button.drag");
    if(h) h.addEventListener("pointerdown", function(e){ startDrag(e, li, list, 'li.item[data-l="'+li.dataset.l+'"]'); });
  });
  v.querySelectorAll("form.add").forEach(function(f){
    f.addEventListener("submit", function(e){
      e.preventDefault(); var name = f.querySelector(".name").value.trim(); if(!name) return;
      state.tasks[f.dataset.l].push({id:uid(), text:name, done:false}); save(); render();
      var ni = document.getElementById("task-n-"+f.dataset.l); if(ni) ni.focus();
    });
  });
}
function openTaskSheet(key, t){
  var s = showSheet(
    '<h3>Editar tarea</h3>'+
    '<div class="field"><label for="t-name">Tarea</label><input id="t-name" value="'+esc(t.text)+'"></div>'+
    '<div class="field"><label for="t-list">Lista</label><select id="t-list">'+TASK_LISTS.map(function(L){ return '<option value="'+L.key+'"'+(L.key===key?' selected':'')+'>'+L.label+'</option>'; }).join("")+'</select></div>'+
    '<div class="row-btns"><button type="button" class="btn danger" id="t-del">Eliminar</button><div><button type="button" class="btn" data-close>Cancelar</button><button type="button" class="btn primary" id="t-save">Guardar</button></div></div>',
    tint(1));
  var list = state.tasks[key];
  s.querySelector("#t-save").addEventListener("click", function(){
    var name = s.querySelector("#t-name").value.trim(); if(name) t.text = name;
    var nk = s.querySelector("#t-list").value;
    if(nk !== key){ list.splice(list.indexOf(t),1); state.tasks[nk].push(t); }
    save(); closeSheet(); render();
  });
  armDelete(s.querySelector("#t-del"), function(){ list.splice(list.indexOf(t),1); save(); closeSheet(); render(); });
}

/* ---------- resumen ---------- */
function renderSummary(){
  var tot = {budget:0, spent:0};
  var rows = state.rooms.map(function(r){
    var t = roomTotals(r); tot.budget += t.budget; tot.spent += t.spent;
    var pct = t.budget ? Math.round(t.spent/t.budget*100) : 0;
    return '<tr class="tinted" style="'+tint(r.color)+'"><td><button type="button" class="room" data-go="'+r.id+'"><span class="dot"></span>'+esc(r.label)+'</button><div class="bar mini"><i style="width:'+pct+'%"></i></div></td>'+
      '<td><strong>'+eur(t.spent)+'</strong></td><td>'+eur(t.budget - t.spent)+'</td><td>'+eur(t.budget)+'</td></tr>';
  }).join("");
  var pct = tot.budget ? Math.round(tot.spent/tot.budget*100) : 0;
  var admin = state.rooms.map(function(r,i){
    return '<div class="row tinted" style="'+tint(r.color)+'"><span class="name"><span class="dot" style="width:10px;height:10px;border-radius:50%;background:var(--c);flex-shrink:0"></span><span>'+esc(r.label)+'</span></span>'+
      '<button type="button" class="icon" data-up="'+r.id+'" aria-label="Subir"'+(i===0?' disabled':'')+'>↑</button>'+
      '<button type="button" class="icon" data-down="'+r.id+'" aria-label="Bajar"'+(i===state.rooms.length-1?' disabled':'')+'>↓</button>'+
      '<button type="button" class="icon" data-redit="'+r.id+'" aria-label="Editar estancia">⋯</button></div>';
  }).join("");
  return '<div class="tinted"><div class="page-head"><h2>Resumen de gastos</h2>'+
    '<p class="sub">Lo gastado suma los productos marcados como comprados. Lo previsto suma todos los productos de la lista (precio × cantidad).</p></div>'+
    '<div class="kpis"><div class="kpi spent"><div class="l">Gastado</div><div class="v">'+eur(tot.spent)+'</div></div>'+
    '<div class="kpi"><div class="l">Por gastar</div><div class="v">'+eur(tot.budget-tot.spent)+'</div></div>'+
    '<div class="kpi"><div class="l">Previsto</div><div class="v">'+eur(tot.budget)+'</div></div></div>'+
    '<div class="bar" style="margin:6px 0 16px"><i style="width:'+pct+'%"></i></div>'+
    '<div class="table-wrap"><table><thead><tr><th>Estancia</th><th>Gastado</th><th>Por gastar</th><th>Previsto</th></tr></thead><tbody>'+rows+'</tbody>'+
    '<tfoot><tr><td>Total</td><td>'+eur(tot.spent)+'</td><td>'+eur(tot.budget-tot.spent)+'</td><td>'+eur(tot.budget)+'</td></tr></tfoot></table></div>'+
    '<h3 class="block">Estancias</h3>'+
    '<div class="rooms-admin">'+admin+'<form id="newRoom"><input id="newRoomName" placeholder="Nueva estancia… (p. ej. Terraza)" autocomplete="off"><button type="submit" class="btn">Crear</button></form></div></div>';
}
function bindSummary(){
  var v = document.getElementById("view");
  v.querySelectorAll("[data-go]").forEach(function(b){ b.addEventListener("click", function(){ go(b.dataset.go); }); });
  function mv(id,d){ var i = state.rooms.findIndex(function(r){ return r.id===id; }); var j=i+d; if(j<0||j>=state.rooms.length) return; state.rooms.splice(j,0,state.rooms.splice(i,1)[0]); save(); render(); }
  v.querySelectorAll("[data-up]").forEach(function(b){ b.addEventListener("click", function(){ mv(b.dataset.up,-1); }); });
  v.querySelectorAll("[data-down]").forEach(function(b){ b.addEventListener("click", function(){ mv(b.dataset.down,1); }); });
  v.querySelectorAll("[data-redit]").forEach(function(b){ b.addEventListener("click", function(){ openRoomSheet(findRoom(b.dataset.redit)); }); });
  document.getElementById("newRoom").addEventListener("submit", function(e){
    e.preventDefault(); var name = document.getElementById("newRoomName").value.trim(); if(!name) return;
    var used = state.rooms.map(function(r){ return r.color; }); var c = 0; while(used.indexOf(c) !== -1 && c < PALETTE.length-1) c++;
    state.rooms.push({id:uid(), label:name, color:c, groups:[{id:uid(), label:"General", items:[]}]}); save(); render();
  });
}
function openRoomSheet(r){
  var s = showSheet(
    '<h3>Estancia</h3>'+
    '<div class="field"><label for="r-name">Nombre</label><input id="r-name" value="'+esc(r.label)+'"></div>'+
    '<div class="field"><label for="r-color">Color</label><select id="r-color">'+PALETTE.map(function(p,i){ return '<option value="'+i+'"'+(i===r.color?' selected':'')+'>Color '+(i+1)+'</option>'; }).join("")+'</select></div>'+
    '<p style="font-size:.82rem;color:var(--ink-soft);margin:0 0 10px">Al eliminar una estancia se borran también sus productos.</p>'+
    '<div class="row-btns"><button type="button" class="btn danger" id="r-del">Eliminar</button><div><button type="button" class="btn" data-close>Cancelar</button><button type="button" class="btn primary" id="r-save">Guardar</button></div></div>',
    tint(r.color));
  s.querySelector("#r-color").addEventListener("change", function(e){ s.setAttribute("style", tint(+e.target.value)); });
  s.querySelector("#r-save").addEventListener("click", function(){
    var name = s.querySelector("#r-name").value.trim(); if(name) r.label = name;
    r.color = +s.querySelector("#r-color").value; save(); closeSheet(); render();
  });
  armDelete(s.querySelector("#r-del"), function(){ state.rooms.splice(state.rooms.indexOf(r),1); save(); closeSheet(); render(); });
}

/* ---------- copia de seguridad ---------- */
function exportBackup(){
  var data = JSON.stringify(state, null, 2);
  var filename = "casa-nueva-copia-" + new Date().toISOString().slice(0,10) + ".json";
  if(downloadsApi){
    downloadsApi.save({filename:filename, data:data}).catch(function(){ toast("No se guardó la copia"); });
    return;
  }
  try{
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([data],{type:"application/json"}));
    a.download = filename; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }catch(e){ toast("No se pudo descargar la copia"); }
}
document.getElementById("exportBackup").addEventListener("click", exportBackup);
document.getElementById("importBackupBtn").addEventListener("click", function(){ document.getElementById("importBackupInput").click(); });
document.getElementById("importBackupInput").addEventListener("change", function(e){
  var f = e.target.files && e.target.files[0]; e.target.value = ""; if(!f) return;
  var rd = new FileReader();
  rd.onload = function(){
    try{ var p = JSON.parse(rd.result); if(!valid(p)) throw 0; state = p; ui.tab = "resumen"; save(); render(); toast("Copia restaurada"); }
    catch(err){ toast("Ese archivo no es una copia de Casa Nueva"); }
  };
  rd.readAsText(f);
});

render();

if(window.claude && typeof window.claude.use === "function"){
  window.claude.use("artifact").then(function(api){ artifactApi = api; }).catch(function(){});
  window.claude.use("downloads").then(function(api){ downloadsApi = api; }).catch(function(){});
}
})();
